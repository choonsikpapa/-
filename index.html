<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리 학교 장소감 지도</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; padding: 15px 10px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; }
    
    .header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 600px; }
    .header h1 { font-size: 20px; color: #1e293b; margin: 0 0 6px 0; }
    .header p { font-size: 13px; color: #64748b; margin: 0; }

    /* 지도 컨테이너 */
    #map-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      touch-action: manipulation;
    }
    
    #map-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 지도 위에 찍히는 이모지 핀 */
    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 26px;
      cursor: pointer;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }
    .pin:active { transform: translate(-50%, -50%) scale(1.3); }

    /* 펼쳐진 이모지 강조 효과 */
    .pin.expanded {
      z-index: 20;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* 겹친 이모지 개수 표시 배지 */
    .cluster-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 15;
    }

    /* 펼쳐질 때 중심점을 나타내는 보조 원 */
    .cluster-center-ring {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border: 2px dashed #6366f1;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.15);
      z-index: 8;
      pointer-events: none;
    }

    /* 모달 팝업창 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
      z-index: 100; padding: 20px;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 16px;
      width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin: 0 0 15px 0; font-size: 18px; color: #0f172a; text-align: center; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none;
    }
    .form-group textarea { resize: none; }
    
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-danger { background: #ef4444; color: white; }

    /* 상세보기 스타일 */
    .view-emoji-box { font-size: 44px; text-align: center; margin-bottom: 6px; }
    .view-place-badge { 
      text-align: center; font-weight: 700; font-size: 15px; color: #4f46e5; 
      background: #eef2ff; border: 1px solid #c7d2fe; padding: 6px 12px; 
      border-radius: 20px; margin-bottom: 12px; display: block;
    }
    .view-text-box { 
      background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; 
      border-radius: 8px; font-size: 14px; color: #334155; line-height: 1.5;
      min-height: 60px; word-break: break-all; white-space: pre-wrap;
    }
    .view-author-box { font-size: 12px; color: #ef4444; font-weight: bold; margin-top: 8px; text-align: right; }

    .admin-bar { margin-top: 15px; display: flex; gap: 8px; align-items: center; }
    .admin-btn { background: #e2e8f0; color: #334155; padding: 6px 12px; font-size: 12px; border-radius: 20px; border: none; }
    .teacher-badge { background: #ef4444; color: white; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏫 우리 학교 장소감 지도</h1>
    <p>지도를 터치하여 장소 이름과 장소감을 남겨보세요!</p>
  </div>

  <div id="map-container">
    <img id="map-img" src="map.jpg" alt="학교 구조도">
  </div>

  <div class="admin-bar">
    <button class="admin-btn" onclick="toggleTeacherMode()">교사 모드</button>
    <span id="teacher-status" class="teacher-badge">교사용 (작성자 표시 & 삭제 가능)</span>
  </div>

  <!-- 작성 모달 -->
  <div id="input-modal" class="modal">
    <div class="modal-content">
      <h3>📍 이 장소의 느낌 남기기</h3>
      
      <div class="form-group">
        <label>장소 이름</label>
        <input type="text" id="input-place" placeholder="예: 3학년 2반 교실, 운동장, 급식실">
      </div>

      <div class="form-group">
        <label>표현할 이모지</label>
        <select id="input-emoji">
          <option value="🥰">🥰 좋음</option>
          <option value="🤣">🤣 재미</option>
          <option value="😎">😎 힙함</option>
          <option value="😢">😢 슬픔</option>
          <option value="😡">😡 화남</option>
          <option value="😐">😐 그냥그래</option>
        </select>
      </div>

      <div class="form-group">
        <label>이유 (장소감) - 전체 공개</label>
        <textarea id="input-text" rows="3" placeholder="예: 친구들과 수다 떨 수 있어서 편안해요!"></textarea>
      </div>

      <div class="form-group">
        <label>학번/이름 (선생님만 확인 가능)</label>
        <input type="text" id="input-author" placeholder="예: 10201 홍길동">
      </div>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn-secondary" onclick="closeModal('input-modal')">취소</button>
          <button class="btn-primary" onclick="saveData()">등록하기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 상세보기 모달 -->
  <div id="view-modal" class="modal">
    <div class="modal-content">
      <div id="view-emoji" class="view-emoji-box">🥰</div>
      <div id="view-place" class="view-place-badge">📍 장소 이름</div>
      <div id="view-text" class="view-text-box">장소감 내용이 출력됩니다.</div>
      <div id="view-author" class="view-author-box"></div>
      
      <div class="btn-group">
        <button class="btn-primary" onclick="addSameLocation()">➕ 나도 이 장소에 남기기</button>
        <div class="btn-row">
          <button id="btn-delete" class="btn-danger" style="display: none;" onclick="deleteCurrentPin()">삭제</button>
          <button class="btn-secondary" onclick="closeModal('view-modal')">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Firebase 키 설정 (다른 학생 기기와 실시간 연동 시 본인 키로 교체)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let database = null;
    let useFirebase = false;

    // Firebase 유효성 확인 후 안전하게 초기화
    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        useFirebase = true;
      } catch (e) {
        console.warn("Firebase 연동 비활성화 (로컬 모드로 작동합니다):", e);
      }
    }

    let myDeviceId = localStorage.getItem('school_map_device_id');
    if (!myDeviceId) {
      myDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      localStorage.setItem('school_map_device_id', myDeviceId);
    }

    // 로컬 저장소에서 기존 데이터 로드
    let tempPins = JSON.parse(localStorage.getItem('school_map_pins') || '[]');
    let isTeacher = false;
    let clickX = 0, clickY = 0;
    let selectedPinId = null;
    let currentSelectedPlace = '';
    let expandedClusterIndex = null;

    const mapContainer = document.getElementById('map-container');

    // Firebase 실시간 수신
    if (useFirebase && database) {
      database.ref('pins').on('value', (snapshot) => {
        const data = snapshot.val();
        tempPins = [];
        if (data) {
          Object.keys(data).forEach(key => tempPins.push(data[key]));
        }
        localStorage.setItem('school_map_pins', JSON.stringify(tempPins));
        renderPins();
      });
    } else {
      // 로컬 모드 즉시 렌더링
      setTimeout(renderPins, 100);
    }

    mapContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('pin') || e.target.classList.contains('cluster-badge')) return;

      if (expandedClusterIndex !== null) {
        expandedClusterIndex = null;
        renderPins();
        return;
      }

      const rect = mapContainer.getBoundingClientRect();
      clickX = ((e.clientX - rect.left) / rect.width) * 100;
      clickY = ((e.clientY - rect.top) / rect.height) * 100;

      openInputModal('');
    });

    function openInputModal(defaultPlace = '') {
      document.getElementById('input-place').value = defaultPlace;
      document.getElementById('input-text').value = '';
      document.getElementById('input-author').value = '';
      openModal('input-modal');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addSameLocation() {
      closeModal('view-modal');
      openInputModal(currentSelectedPlace);
    }

    // 💾 데이터 저장 (오류 방지 및 안정적인 등록 처리)
    function saveData() {
      const place = document.getElementById('input-place').value.trim();
      const emoji = document.getElementById('input-emoji').value;
      const text = document.getElementById('input-text').value.trim();
      const author = document.getElementById('input-author').value.trim();

      if (!place) {
        alert('장소 이름을 입력해주세요!');
        return;
      }
      if (!text || !author) {
        alert('장소감 내용과 이름을 모두 입력해주세요!');
        return;
      }

      const pinId = 'pin_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

      const pinData = {
        id: pinId,
        x: clickX,
        y: clickY,
        place: place,
        emoji: emoji,
        text: text,
        author: author,
        deviceId: myDeviceId,
        timestamp: Date.now()
      };

      // 1. 로컬에 즉시 등록
      tempPins.push(pinData);
      localStorage.setItem('school_map_pins', JSON.stringify(tempPins));

      // 2. Firebase 활성화 시 서버에 전송
      if (useFirebase && database) {
        database.ref('pins/' + pinId).set(pinData).catch(err => console.error(err));
      }

      expandedClusterIndex = null;
      renderPins();
      closeModal('input-modal');
    }

    function groupPinsIntoClusters(pins) {
      const threshold = 3.5;
      const clusters = [];
      const visited = new Set();

      for (let i = 0; i < pins.length; i++) {
        if (visited.has(pins[i].id)) continue;

        const cluster = [pins[i]];
        visited.add(pins[i].id);

        for (let j = i + 1; j < pins.length; j++) {
          if (visited.has(pins[j].id)) continue;

          const dx = pins[i].x - pins[j].x;
          const dy = pins[i].y - pins[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < threshold) {
            cluster.push(pins[j]);
            visited.add(pins[j].id);
          }
        }
        clusters.push(cluster);
      }
      return clusters;
    }

    function renderPins() {
      document.querySelectorAll('.pin, .cluster-badge, .cluster-center-ring').forEach(el => el.remove());

      const clusters = groupPinsIntoClusters(tempPins);

      clusters.forEach((cluster, index) => {
        const centerX = cluster.reduce((sum, p) => sum + p.x, 0) / cluster.length;
        const centerY = cluster.reduce((sum, p) => sum + p.y, 0) / cluster.length;

        const isExpanded = (expandedClusterIndex === index);

        if (cluster.length === 1) {
          createPinElement(cluster[0], cluster[0].x, cluster[0].y);
        } else {
          if (!isExpanded) {
            const topPin = createPinElement(cluster[cluster.length - 1], centerX, centerY);

            const badge = document.createElement('div');
            badge.className = 'cluster-badge';
            badge.innerText = `+${cluster.length}`;
            badge.style.left = `${centerX + 2.2}%`;
            badge.style.top = `${centerY - 2.2}%`;

            const expandHandler = (e) => {
              e.stopPropagation();
              expandedClusterIndex = index;
              renderPins();
            };

            badge.addEventListener('click', expandHandler);
            topPin.addEventListener('click', expandHandler);

            mapContainer.appendChild(badge);
          } else {
            const ring = document.createElement('div');
            ring.className = 'cluster-center-ring';
            ring.style.left = `${centerX}%`;
            ring.style.top = `${centerY}%`;
            mapContainer.appendChild(ring);

            const radius = Math.min(4.5 + cluster.length * 0.5, 9);

            cluster.forEach((pinData, i) => {
              const angle = (2 * Math.PI * i) / cluster.length - (Math.PI / 2);
              const spreadX = Math.min(Math.max(centerX + radius * Math.cos(angle), 3), 97);
              const spreadY = Math.min(Math.max(centerY + radius * Math.sin(angle), 3), 97);

              const pinEl = createPinElement(pinData, spreadX, spreadY);
              pinEl.classList.add('expanded');
            });
          }
        }
      });
    }

    function createPinElement(data, x, y) {
      const pinEl = document.createElement('div');
      pinEl.className = 'pin';
      pinEl.style.left = `${x}%`;
      pinEl.style.top = `${y}%`;
      pinEl.innerText = data.emoji;

      pinEl.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedPinId = data.id;
        clickX = data.x;
        clickY = data.y;
        currentSelectedPlace = data.place || '학교 장소';

        document.getElementById('view-emoji').innerText = data.emoji;
        document.getElementById('view-place').innerText = `📍 ${currentSelectedPlace}`;
        document.getElementById('view-text').innerText = data.text;
        
        const authorBox = document.getElementById('view-author');
        if (isTeacher) {
          authorBox.innerText = `👤 작성자: ${data.author}`;
          authorBox.style.display = 'block';
        } else {
          authorBox.style.display = 'none';
        }

        const deleteBtn = document.getElementById('btn-delete');
        if (data.deviceId === myDeviceId || isTeacher) {
          deleteBtn.style.display = 'block';
        } else {
          deleteBtn.style.display = 'none';
        }

        openModal('view-modal');
      });

      mapContainer.appendChild(pinEl);
      return pinEl;
    }

    function deleteCurrentPin() {
      if (!selectedPinId) return;

      if (confirm('이 장소감을 정말 삭제하시겠습니까?')) {
        tempPins = tempPins.filter(p => p.id !== selectedPinId);
        localStorage.setItem('school_map_pins', JSON.stringify(tempPins));

        if (useFirebase && database) {
          database.ref('pins/' + selectedPinId).remove();
        }

        expandedClusterIndex = null;
        renderPins();
        closeModal('view-modal');
      }
    }

    function toggleTeacherMode() {
      if (!isTeacher) {
        const pwd = prompt('교사 비밀번호를 입력하세요:');
        if (pwd === '1234') {
          isTeacher = true;
          document.getElementById('teacher-status').style.display = 'inline-block';
          alert('교사 모드가 활성화되었습니다.');
          renderPins();
        } else {
          alert('비밀번호가 틀렸습니다.');
        }
      } else {
        isTeacher = false;
        document.getElementById('teacher-status').style.display = 'none';
        alert('학생 모드로 전환되었습니다.');
        renderPins();
      }
    }
  </script>
</body>
</html>
