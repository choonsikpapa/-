<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리 학교 장소감 지도</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { margin: 0; padding: 15px 10px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; }
    
    .header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 600px; }
    .header h1 { font-size: 20px; color: #1e293b; margin: 0 0 6px 0; }
    .header p { font-size: 13px; color: #64748b; margin: 0 0 10px 0; }

    /* 학급 선택 바 */
    .class-selector-box {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .class-selector-box label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }
    .class-selector-box select {
      padding: 6px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      background-color: #eef2ff;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    .class-selector-box select:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      border-color: #cbd5e1;
      cursor: not-allowed;
    }

    .btn-qr-show {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 지도 컨테이너 */
    #map-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      touch-action: none;
      user-select: none;
    }
    
    #map-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      transition: transform 0.1s ease-out;
      cursor: grab;
    }
    #map-wrapper:active { cursor: grabbing; }

    #map-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Zoom 조종 버튼 */
    .zoom-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .zoom-btn:active { background: #e2e8f0; transform: scale(0.95); }

    /* 이모지 핀 */
    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 28px;
      cursor: pointer;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
      pointer-events: auto;
    }
    .pin:active { transform: translate(-50%, -50%) scale(1.3); }

    .pin.expanded {
      z-index: 30;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .cluster-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 25;
      pointer-events: auto;
    }

    .cluster-center-ring {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border: 2px dashed #6366f1;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.15);
      z-index: 8;
      pointer-events: none;
    }

    /* 모달 팝업창 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
      z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 16px;
      width: 100%; max-width: 360px; 
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin: 0 0 15px 0; font-size: 18px; color: #0f172a; text-align: center; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none;
    }
    .form-group textarea { resize: none; }
    
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-danger { background: #ef4444; color: white; }

    .view-emoji-box { font-size: 44px; text-align: center; margin-bottom: 6px; }
    .view-place-badge { 
      text-align: center; font-weight: 700; font-size: 15px; color: #4f46e5; 
      background: #eef2ff; border: 1px solid #c7d2fe; padding: 6px 12px; 
      border-radius: 20px; margin-bottom: 12px; display: block;
    }
    .view-text-box { 
      background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; 
      border-radius: 8px; font-size: 14px; color: #334155; line-height: 1.5;
      min-height: 60px; word-break: break-all; white-space: pre-wrap;
    }
    .view-author-box { font-size: 12px; color: #ef4444; font-weight: bold; margin-top: 8px; text-align: right; }

    .admin-bar { margin-top: 15px; display: flex; gap: 8px; align-items: center; }
    .admin-btn { background: #e2e8f0; color: #334155; padding: 6px 12px; font-size: 12px; border-radius: 20px; border: none; }
    .teacher-badge { background: #ef4444; color: white; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏫 우리 학교 장소감 지도</h1>
    <p>지도를 터치하여 장소 이름과 장소감을 남겨보세요!</p>
    
    <div class="class-selector-box">
      <label for="class-select">👥 수업 학급:</label>
      <select id="class-select" onchange="changeClass(this.value, true)">
        <option value="class1">1반</option>
        <option value="class2">2반</option>
        <option value="class3">3반</option>
        <option value="class4">4반</option>
        <option value="class5">5반</option>
      </select>
      <button class="btn-qr-show" onclick="showClassQR()">📱 반 전용 QR 보기</button>
    </div>
  </div>

  <div id="map-container">
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomIn()" title="확대">➕</button>
      <button class="zoom-btn" onclick="zoomOut()" title="축소">➖</button>
      <button class="zoom-btn" onclick="resetZoom()" title="초기화">🔄</button>
    </div>

    <div id="map-wrapper">
      <img id="map-img" src="map.jpg" alt="학교 구조도">
    </div>
  </div>

  <div class="admin-bar">
    <button class="admin-btn" onclick="toggleTeacherMode()">교사 모드</button>
    <span id="teacher-status" class="teacher-badge">교사용 (작성자 표시 & 삭제 가능)</span>
  </div>

  <!-- QR코드 모달 -->
  <div id="qr-modal" class="modal">
    <div class="modal-content" style="text-align: center;">
      <h3 id="qr-modal-title">👥 학급 전용 QR코드</h3>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">학생들이 스캔하면 해당 반으로 바로 접속되며 반 이동이 잠깁니다.</p>
      <img id="qr-img" src="" alt="QR Code" style="width: 200px; height: 200px; margin: 0 auto; display: block; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px; background: white;">
      <div class="btn-group" style="margin-top: 15px;">
        <button class="btn-secondary" onclick="closeModal('qr-modal')">닫기</button>
      </div>
    </div>
  </div>

  <!-- 작성 모달 -->
  <div id="input-modal" class="modal">
    <div class="modal-content">
      <h3>📍 이 장소의 느낌 남기기</h3>
      
      <div class="form-group">
        <label>장소 이름</label>
        <input type="text" id="input-place" placeholder="예: 3학년 2반 교실, 운동장, 급식실">
      </div>

      <div class="form-group">
        <label>표현할 이모지</label>
        <select id="input-emoji">
          <option value="🥰">🥰 좋음</option>
          <option value="🤣">🤣 재미</option>
          <option value="😎">😎 힙함</option>
          <option value="😢">😢 슬픔</option>
          <option value="😡">😡 화남</option>
          <option value="😐">😐 그냥그래</option>
          <option value="😒">😒 지루함</option>
          <option value="🤮">🤮 더러움</option>
          <option value="😱">😱 무서움</option>
        </select>
      </div>

      <div class="form-group">
        <label>이유 (장소감) - 전체 공개</label>
        <textarea id="input-text" rows="3" placeholder="예: 친구들과 수다 떨 수 있어서 편안해요!"></textarea>
      </div>

      <div class="form-group">
        <label>학번/이름 (선생님만 확인 가능)</label>
        <input type="text" id="input-author" placeholder="예: 10201 홍길동">
      </div>

      <div class="btn-group">
        <div class="btn-row">
          <button class="btn-secondary" onclick="closeModal('input-modal')">취소</button>
          <button class="btn-primary" onclick="saveData()">등록하기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 상세보기 모달 -->
  <div id="view-modal" class="modal">
    <div class="modal-content">
      <div id="view-emoji" class="view-emoji-box">🥰</div>
      <div id="view-place" class="view-place-badge">📍 장소 이름</div>
      <div id="view-text" class="view-text-box">장소감 내용이 출력됩니다.</div>
      <div id="view-author" class="view-author-box"></div>
      
      <div class="btn-group">
        <button class="btn-primary" onclick="addSameLocation()">➕ 나도 이 장소에 남기기</button>
        <div class="btn-row">
          <button id="btn-delete" class="btn-danger" style="display: none;" onclick="deleteCurrentPin()">삭제</button>
          <button class="btn-secondary" onclick="closeModal('view-modal')">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyApMPAqxrQGJfE_1V-tfykFYTX-VZ7I22E",
      authDomain: "hanjitam01.firebaseapp.com",
      databaseURL: "https://hanjitam01-default-rtdb.firebaseio.com",
      projectId: "hanjitam01",
      storageBucket: "hanjitam01.firebasestorage.app",
      messagingSenderId: "676468244405",
      appId: "1:676468244405:web:838ef65b7eff53aa4723fc"
    };

    let database = null;
    let useFirebase = false;

    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        useFirebase = true;
      } catch (e) {
        console.warn("Firebase 연동 실패 (로컬 모드로 작동합니다):", e);
      }
    }

    let myDeviceId = localStorage.getItem('school_map_device_id');
    if (!myDeviceId) {
      myDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      localStorage.setItem('school_map_device_id', myDeviceId);
    }

    let currentClass = 'class1';
    let currentClassRef = null;
    let tempPins = [];
    let isTeacher = false;
    let clickX = 0, clickY = 0;
    let selectedPinId = null;
    let currentSelectedPlace = '';
    let expandedClusterIndex = null;

    const mapContainer = document.getElementById('map-container');
    const mapWrapper = document.getElementById('map-wrapper');

    let currentScale = 1;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;
    let hasMoved = false;

    function updateMapTransform() {
      const rect = mapContainer.getBoundingClientRect();
      const maxPanX = 0;
      const minPanX = rect.width * (1 - currentScale);
      const maxPanY = 0;
      const minPanY = rect.height * (1 - currentScale);

      if (currentScale === 1) {
        panX = 0; panY = 0;
      } else {
        panX = Math.min(maxPanX, Math.max(minPanX, panX));
        panY = Math.min(maxPanY, Math.max(minPanY, panY));
      }
      mapWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
    }

    function zoomIn() { if (currentScale < 3) { currentScale += 0.5; updateMapTransform(); } }
    function zoomOut() { if (currentScale > 1) { currentScale -= 0.5; if (currentScale === 1) { panX = 0; panY = 0; } updateMapTransform(); } }
    function resetZoom() { currentScale = 1; panX = 0; panY = 0; updateMapTransform(); }

    mapContainer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.zoom-controls') || e.target.closest('.pin') || e.target.closest('.cluster-badge')) {
        isDragging = false;
        return;
      }

      isDragging = true;
      hasMoved = false;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      
      try {
        mapContainer.setPointerCapture(e.pointerId);
      } catch (err) {}
    });

    mapContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      if (Math.abs(dx - panX) > 4 || Math.abs(dy - panY) > 4) {
        hasMoved = true;
      }

      if (currentScale > 1) {
        panX = dx;
        panY = dy;
        updateMapTransform();
      }
    });

    mapContainer.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try {
        mapContainer.releasePointerCapture(e.pointerId);
      } catch (err) {}

      if (!hasMoved) {
        handleMapClick(e);
      }
    });

    function handleMapClick(e) {
      if (e.target.closest('.pin') || e.target.closest('.cluster-badge')) return;
      
      if (expandedClusterIndex !== null) {
        expandedClusterIndex = null;
        renderPins();
        return;
      }
      
      const rect = mapWrapper.getBoundingClientRect();
      clickX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      clickY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
      openInputModal('');
    }

    function changeClass(classId, updateUrl = true) {
      if (currentClassRef && useFirebase) currentClassRef.off();
      currentClass = classId;
      tempPins = JSON.parse(localStorage.getItem('school_map_pins_' + currentClass) || '[]');
      expandedClusterIndex = null;
      renderPins();

      if (updateUrl) {
        const classNum = currentClass.replace('class', '');
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?class=' + classNum;
        window.history.replaceState({path: newUrl}, '', newUrl);
      }

      if (useFirebase && database) {
        currentClassRef = database.ref('pins/' + currentClass);
        currentClassRef.on('value', (snapshot) => {
          const data = snapshot.val();
          tempPins = [];
          if (data) Object.keys(data).forEach(key => tempPins.push(data[key]));
          localStorage.setItem('school_map_pins_' + currentClass, JSON.stringify(tempPins));
          renderPins();
        });
      }
    }

    function showClassQR() {
      const classNum = currentClass.replace('class', '');
      const classUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?class=' + classNum;
      
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(classUrl)}`;
      document.getElementById('qr-img').src = qrApiUrl;
      document.getElementById('qr-modal-title').innerText = `👥 ${classNum}반 전용 QR코드`;
      openModal('qr-modal');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let urlClass = urlParams.get('class');
      const selectEl = document.getElementById('class-select');

      if (urlClass) {
        if (!urlClass.startsWith('class')) {
          urlClass = 'class' + urlClass;
        }

        if (selectEl.querySelector(`option[value="${urlClass}"]`)) {
          selectEl.value = urlClass;
          selectEl.disabled = true;
          changeClass(urlClass, false);
          return;
        }
      }
      changeClass('class1', false);
    });

    function openInputModal(defaultPlace = '') {
      document.getElementById('input-place').value = defaultPlace;
      document.getElementById('input-text').value = '';
      document.getElementById('input-author').value = '';
      openModal('input-modal');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addSameLocation() { closeModal('view-modal'); openInputModal(currentSelectedPlace); }

    function saveData() {
      const place = document.getElementById('input-place').value.trim();
      const emoji = document.getElementById('input-emoji').value;
      const text = document.getElementById('input-text').value.trim();
      const author = document.getElementById('input-author').value.trim();

      if (!place || !text || !author) {
        alert('모든 항목을 입력해주세요!'); return;
      }

      const pinId = 'pin_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      const pinData = { id: pinId, x: clickX, y: clickY, place, emoji, text, author, deviceId: myDeviceId, timestamp: Date.now() };

      tempPins.push(pinData);
      localStorage.setItem('school_map_pins_' + currentClass, JSON.stringify(tempPins));

      if (useFirebase && database) {
        database.ref('pins/' + currentClass + '/' + pinId).set(pinData);
      }

      expandedClusterIndex = null;
      renderPins();
      closeModal('input-modal');
    }

    function groupPinsIntoClusters(pins) {
      const threshold = 3.5;
      const clusters = [];
      const visited = new Set();

      for (let i = 0; i < pins.length; i++) {
        if (visited.has(pins[i].id)) continue;
        const cluster = [pins[i]];
        visited.add(pins[i].id);

        for (let j = i + 1; j < pins.length; j++) {
          if (visited.has(pins[j].id)) continue;
          const dx = pins[i].x - pins[j].x; const dy = pins[i].y - pins[j].y;
          if (Math.sqrt(dx * dx + dy * dy) < threshold) {
            cluster.push(pins[j]); visited.add(pins[j].id);
          }
        }
        clusters.push(cluster);
      }
      return clusters;
    }

    function renderPins() {
      document.querySelectorAll('.pin, .cluster-badge, .cluster-center-ring').forEach(el => el.remove());
      const clusters = groupPinsIntoClusters(tempPins);

      clusters.forEach((cluster, index) => {
        const centerX = cluster.reduce((sum, p) => sum + p.x, 0) / cluster.length;
        const centerY = cluster.reduce((sum, p) => sum + p.y, 0) / cluster.length;
        const isExpanded = (expandedClusterIndex === index);

        if (cluster.length === 1) {
          createPinElement(cluster[0], cluster[0].x, cluster[0].y);
        } else {
          if (!isExpanded) {
            const topPin = createPinElement(cluster[cluster.length - 1], centerX, centerY);
            const badge = document.createElement('div');
            badge.className = 'cluster-badge'; badge.innerText = `+${cluster.length}`;
            badge.style.left = `${centerX + 2.2}%`; badge.style.top = `${centerY - 2.2}%`;

            const expandHandler = (e) => { e.stopPropagation(); expandedClusterIndex = index; renderPins(); };
            badge.addEventListener('click', expandHandler);
            topPin.addEventListener('click', expandHandler);
            mapWrapper.appendChild(badge);
          } else {
            const ring = document.createElement('div');
            ring.className = 'cluster-center-ring';
            ring.style.left = `${centerX}%`; ring.style.top = `${centerY}%`;
            mapWrapper.appendChild(ring);

            const radius = Math.min(4.5 + cluster.length * 0.5, 9);
            cluster.forEach((pinData, i) => {
              const angle = (2 * Math.PI * i) / cluster.length - (Math.PI / 2);
              const spreadX = Math.min(Math.max(centerX + radius * Math.cos(angle), 3), 97);
              const spreadY = Math.min(Math.max(centerY + radius * Math.sin(angle), 3), 97);
              const pinEl = createPinElement(pinData, spreadX, spreadY);
              pinEl.classList.add('expanded');
            });
          }
        }
      });
    }

    function createPinElement(data, x, y) {
      const pinEl = document.createElement('div');
      pinEl.className = 'pin';
      pinEl.style.left = `${x}%`; pinEl.style.top = `${y}%`;
      pinEl.innerText = data.emoji;

      pinEl.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedPinId = data.id;
        clickX = data.x;
        clickY = data.y;
        currentSelectedPlace = data.place || '학교 장소';

        document.getElementById('view-emoji').innerText = data.emoji;
        document.getElementById('view-place').innerText = `📍 ${currentSelectedPlace}`;
        document.getElementById('view-text').innerText = data.text;
        
        const authorBox = document.getElementById('view-author');
        if (isTeacher) {
          authorBox.innerText = `👤 작성자: ${data.author || '익명'}`;
          authorBox.style.display = 'block';
        } else {
          authorBox.style.display = 'none';
        }

        document.getElementById('btn-delete').style.display = (data.deviceId === myDeviceId || isTeacher) ? 'block' : 'none';
        openModal('view-modal');
      });

      mapWrapper.appendChild(pinEl);
      return pinEl;
    }

    function deleteCurrentPin() {
      if (!selectedPinId) return;
      if (confirm('이 장소감을 정말 삭제하시겠습니까?')) {
        tempPins = tempPins.filter(p => p.id !== selectedPinId);
        localStorage.setItem('school_map_pins_' + currentClass, JSON.stringify(tempPins));
        if (useFirebase && database) database.ref('pins/' + currentClass + '/' + selectedPinId).remove();
        expandedClusterIndex = null; renderPins(); closeModal('view-modal');
      }
    }

    function toggleTeacherMode() {
      if (!isTeacher) {
        if (prompt('교사 비밀번호를 입력하세요:') === '1234') {
          isTeacher = true;
          document.getElementById('teacher-status').style.display = 'inline-block';
          document.getElementById('class-select').disabled = false;
          alert('교사 모드가 활성화되었습니다.');
          renderPins();
        } else alert('비밀번호가 틀렸습니다.');
      } else {
        isTeacher = false;
        document.getElementById('teacher-status').style.display = 'none';
        alert('학생 모드로 전환되었습니다.');
        renderPins();
      }
    }
  </script>
</body>
</html>
